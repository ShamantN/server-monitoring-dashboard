services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: telemetry_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./DBConfig/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - telemetry-net

  
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: telemetry_kafka
    restart: unless-stopped
    ports: 
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - telemetry-net

    
  grafana:
      image: grafana/grafana-oss:latest
      container_name: telemetry_grafana
      restart: unless-stopped
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
      depends_on:
        - timescaledb
      volumes:
        - grafana_data:/var/lib/grafana
      networks:
        - telemetry-net
  
  
  consumer:
    build:
      context: ./Consumer
      dockerfile: Dockerfile.consumer
    image: samduckling/telemetry-consumer:latest
    container_name: telemetry_consumer
    restart: unless-stopped
    depends_on:
      - kafka
      - timescaledb
    environment:
      KAFKA_FERNET_KEY: ${KAFKA_FERNET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks:
      - telemetry-net

    
  producer_node_1:
    build:
      context: ./Producer
      dockerfile: Dockerfile.producer
    image: samduckling/telemetry-producer:latest
    container_name: producer_node_1
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_FERNET_KEY: ${KAFKA_FERNET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SERVER_ID: "NODE-1"
    networks:
      - telemetry-net

  producer_node_2:
    build:
      context: ./Producer
      dockerfile: Dockerfile.producer
    image: samduckling/telemetry-producer:latest
    container_name: producer_node_2
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_FERNET_KEY: ${KAFKA_FERNET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SERVER_ID: "NODE-2"
    networks:
      - telemetry-net

  producer_node_3:
    build:
      context: ./Producer
      dockerfile: Dockerfile.producer
    image: samduckling/telemetry-producer:latest
    container_name: producer_node_3
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_FERNET_KEY: ${KAFKA_FERNET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SERVER_ID: "NODE-3"
    networks:
      - telemetry-net



volumes:
  timescale_data:
  kafka_data:
  grafana_data:

networks:
  telemetry-net:
    driver: bridge